name: Build Christmas Ideas NZ Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'bundle.part.*'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore app source
        run: |
          rm -rf app
          mkdir -p app
          cat bundle.part.00 bundle.part.01 bundle.part.02 bundle.part.03 bundle.part.04 bundle.part.05 > /tmp/app.b64
          base64 -d /tmp/app.b64 > /tmp/christmas_ideas_app.tgz
          tar -xzf /tmp/christmas_ideas_app.tgz -C app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: app
        run: flutter create . --platforms=android --project-name christmas_ideas_nz --org nz.co.christmasideas

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze lib --no-fatal-infos

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: christmas-ideas-nz-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
