name: Build Christmas Ideas NZ Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test_app/**'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: |
          rm -rf generated_app
          flutter create generated_app --platforms=android --project-name christmas_ideas_nz_test --org nz.co.christmasideas
          cp test_app/pubspec.yaml generated_app/pubspec.yaml
          cp test_app/main.dart generated_app/lib/main.dart

      - name: Get packages
        working-directory: generated_app
        run: flutter pub get

      - name: Analyze
        working-directory: generated_app
        run: flutter analyze lib --no-fatal-infos

      - name: Build debug APK
        working-directory: generated_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: christmas-ideas-nz-test-apk
          path: generated_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
