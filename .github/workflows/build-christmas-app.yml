name: Build Christmas Ideas NZ Android APK

on:
  push:
    branches: [main]
    paths:
      - 'build/christmas_ideas_nz_source.b64'
      - '.github/workflows/build-christmas-app.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android host project
        run: |
          rm -rf generated_app
          mkdir generated_app
          cd generated_app
          flutter create --platforms=android --org nz.co.christmasideas --project-name christmas_ideas_nz .

      - name: Restore Christmas Ideas NZ source
        run: |
          base64 -d build/christmas_ideas_nz_source.b64 > /tmp/christmas_source.zip
          unzip -o /tmp/christmas_source.zip -d generated_app

      - name: Get packages
        working-directory: generated_app
        run: flutter pub get

      - name: Analyse app
        working-directory: generated_app
        run: flutter analyze

      - name: Build debug APK
        working-directory: generated_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: christmas-ideas-nz-debug-apk
          path: generated_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
